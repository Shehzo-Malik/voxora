<!DOCTYPE html>
<html lang="en" data-mode="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voxora - AI Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700;800&family=Plus+Jakarta+Sans:wght@400;500;600&family=Noto+Naskh+Arabic:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#22d3ee">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%2322d3ee%27/%3E%3Ctext x=%2716%27 y=%2723%27 font-size=%2720%27 text-anchor=%27middle%27 fill=%27white%27 font-family=%27Arial%27 font-weight=%27bold%27%3EV%3C/text%3E%3C/svg%3E">
</head>
<body>
<div class="bg"><i class="blob b1"></i><i class="blob b2"></i><div class="floor"></div></div>
<header>
  <div class="brand">
    <button class="ib" aria-label="Toggle sidebar" onclick="toggleSide()"><i class="fa-solid fa-bars-staggered"></i></button>
    <div class="cw"><div class="cube"><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
    <div><h1>Voxora</h1><div class="st"><b></b><span id="model-label">Voxora</span> • Live streaming • Multilingual</div></div>
  </div>
  <div class="tools">
    <select id="model-select" class="ib" aria-label="Model" onchange="onModelChange(this.value)">
      <option value="gemini-3.5-flash-lite">⚡ Voxora Turbo</option>
      <option value="gemini-3.5-flash">Voxora Pro</option>
      <option value="auto">Auto-detect</option>
    </select>
    <button class="ib" aria-label="Themes" onclick="toggleThemeMenu(event)"><i class="fa-solid fa-palette" style="color:var(--a)"></i><span class="hide">Themes</span></button>
    <button class="ib" aria-label="Dark or light mode" onclick="toggleMode()"><i id="mi" class="fa-solid fa-moon"></i></button>
    <div id="tm"></div>
  </div>
</header>
<div class="wrap">
<aside>
  <button class="newc" onclick="newChat();closeSideMobile()"><i class="fa-solid fa-plus"></i> New chat</button>
  <div id="hist"></div>
  <button class="ib" onclick="showMem()" style="justify-content:flex-start"><i class="fa-solid fa-brain" style="color:var(--a)"></i> Memory <span id="mc" style="margin-left:auto;color:var(--mu)">0</span></button>
  <div class="acct"><div class="pic" id="pic">G</div><div class="nm2" id="an">Guest</div><button class="lk" id="ab" onclick="acctBtn()">Sign in</button></div>
</aside>
<div class="col2">
<main id="chat-container">
  <section id="welcome">
    <div class="stage"><div class="ring r2"></div><div class="ring"></div><div class="orb"></div><div class="shadow"></div></div>
    <h2>Voxora</h2>
    <p>Hello! I'm Voxora. Ask me anything, chat in any language, upload a file or photo, or ask me to create an image.</p>
    <div class="chips">
      <button class="chip" onclick="quickAsk(this.textContent)">Explain Docker in simple words</button>
      <button class="chip" onclick="quickAsk(this.textContent)">Write a Python REST API example</button>
      <button class="chip" onclick="quickAsk(this.textContent)">Create an image of a futuristic city at sunset</button>
      <button class="chip" onclick="quickAsk(this.textContent)">Translate to Urdu: Good morning</button>
    </div>
  </section>
</main>
<footer>
  <div id="pf"></div>
  <div class="bar">
    <input type="file" id="fi" multiple hidden accept="image/*,application/pdf,text/*,.txt,.md,.csv,.json,.py,.js,.html,.yml,.yaml,.tf,.sh,.log,.xml">
    <button class="tg" id="att" aria-label="Attach a file or photo" title="Attach a file or photo" onclick="document.getElementById('fi').click()"><i class="fa-solid fa-paperclip"></i></button>
    <button class="tg" id="imb" aria-label="Create image mode" title="Create image mode" onclick="toggleImg()"><i class="fa-solid fa-image"></i></button>
    <textarea id="user-input" rows="1" dir="auto" placeholder="Ask anything from Voxora..."></textarea>
    <button id="send-btn" class="send" aria-label="Send" onclick="onSendClick()"><i id="send-icon" class="fa-solid fa-arrow-up"></i></button>
  </div>
  <div class="sig"><div class="pill"><span>Developed by</span><span class="nm" title="Muhammad Shehzal Abbas">Shehzal Abbas</span><span class="role"><i class="fa-solid fa-terminal"></i> DevOps &amp; Software Engineer</span></div></div>
</footer>
</div>
</div>
<div id="ov"><div class="md" id="mdb"></div></div>
<div id="toast"></div>
<script src="js/config.js"></script>
<script src="js/core.js"></script>
<script src="js/theme.js"></script>
<script src="js/auth.js"></script>
<script src="js/chat.js"></script>
<script src="js/ai.js"></script>
<script>if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))</script>
</body>
</html>
